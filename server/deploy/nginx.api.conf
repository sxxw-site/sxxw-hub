# Nginx 反向代理:api.sxxw.site → 本机 Node 服务(127.0.0.1:8787)
# 放到 /etc/nginx/conf.d/api.sxxw.site.conf,改完 nginx -t && systemctl reload nginx
#
# HTTPS 证书用 certbot 申请:
#   certbot --nginx -d api.sxxw.site
# certbot 会自动补全下面的 443 配置与证书路径。

server {
    listen 80;
    server_name api.sxxw.site;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
