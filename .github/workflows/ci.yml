name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main 的部署由 deploy.yml 负责

permissions:
  contents: read

jobs:
  web:
    name: Web (lint / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

# 注:server/(Go API)由本地/服务器手动部署,不进 CI。
# 提交前请在本地跑:cd server && make check
